<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Kulture · Myth or Biblical Truth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fbf1e6;--ink:#14110f;--gold:#f0a81e;--card:#fffaf3;--line:#e6d6c0;--mut:#6b5f52;--orb:rgba(240,168,30,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--ink:#f6ead9;--card:#221c16;--line:#3a3026;--mut:#b9a993;--orb:rgba(240,168,30,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--ink:#f6ead9;--card:#221c16;--line:#3a3026;--mut:#b9a993;--orb:rgba(240,168,30,.12);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;background:var(--orb);filter:blur(6px);animation:fl 22s ease-in-out infinite}
.ring{position:absolute;border:1.5px solid var(--gold);border-radius:50%;opacity:.35;animation:sp 60s linear infinite}
.ring::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--bg);border-left-color:transparent;border-bottom-color:transparent}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-50px) scale(1.12)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb,.ring{animation:none}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;margin-bottom:14px}
.logo{width:200px;max-width:60vw;aspect-ratio:1200/1131;margin:0 auto 6px;background:var(--ink);-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat}
.verse{text-align:left;margin:10px 0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--bg);border-radius:8px;white-space:pre-line;line-height:1.45;font-size:.95rem}
.verse b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;color:var(--ink);margin-bottom:2px}
.bar{display:flex;align-items:center;gap:12px;justify-content:center;margin:2px 0}
.bar i{height:5px;width:44px;border-radius:3px;background:var(--gold)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--mut);margin:4px 0 0;font-size:.95rem}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(120,80,20,.07)}
.card{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card p{flex:1 1 100%;margin:0;font-size:1.05rem;line-height:1.4}
.n{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.4rem;font-weight:700;color:var(--gold)}
.btns{display:flex;gap:10px;flex:1 1 100%}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:11px 20px;transition:.2s}
.btns button{flex:1}
button.on{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
.go{background:var(--gold);border-color:var(--gold);color:#14110f}
.go:hover{filter:brightness(1.06)}
.tm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:2.2rem;font-weight:700;background:var(--bg);border-bottom:2px solid var(--gold);padding:6px 0;margin:0 -16px;transition:color .3s}
.tm.low{color:#c0392b}
.c{text-align:center}.mut{color:var(--mut)}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:14px;margin:8px 0}
input{font:inherit;width:80px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:10px}
.badge{display:inline-block;font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;font-weight:700;letter-spacing:.06em;padding:4px 26px;border-radius:14px;margin:8px 0}
.badge.T{background:var(--gold);color:#14110f}.badge.M{background:var(--ink);color:var(--bg)}
.res{margin:12px 0 4px;text-align:left}
.res div{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.track{height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;transition:width 1s ease}
.fill.T{background:var(--gold)}.fill.M{background:var(--ink)}
.small{font-size:.85rem;word-break:break-all}
</style></head><body>
<div class="bg">
<div class="orb" style="width:260px;height:260px;left:-60px;top:8%"></div>
<div class="orb" style="width:180px;height:180px;right:-30px;top:40%;animation-delay:-8s;animation-duration:28s"></div>
<div class="orb" style="width:220px;height:220px;left:30%;bottom:-70px;animation-delay:-14s"></div>
<div class="ring" style="width:340px;height:340px;right:-120px;top:-100px"></div>
<div class="ring" style="width:240px;height:240px;left:-90px;bottom:12%;animation-direction:reverse"></div>
</div>
<main>
<header>
<div class="logo" role="img" aria-label="Kingdom Kulture logo"></div>
<div class="bar"><i></i><h1>Myth or Biblical Truth</h1><i></i></div>
</header>
<div id="app"><p class="c mut">Connecting…</p></div>
</main>
<script>
const KEY=new URLSearchParams(location.search).get("key"),host=!!KEY;
const $=s=>document.querySelector(s),app=$("#app");
let uid;try{uid=localStorage.getItem("kk")||("g"+Math.random().toString(36).slice(2,12));localStorage.setItem("kk",uid)}catch(e){uid="g"+Math.random().toString(36).slice(2,12)}
let Q=[],S=null,off=0,mine={},round=null,lastKey="";
const qrEl=document.createElement("div");qrEl.id="qr";
const joinUrl=location.origin+"/";
try{new QRCode(qrEl,{text:joinUrl,width:190,height:190,colorDark:"#14110f",colorLight:"#ffffff"})}catch(e){qrEl.textContent=joinUrl}
const now=()=>Date.now()+off,N=()=>Q.length;
const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")};
const isLocked=()=>!S||S.phase!=="answering"||now()>=S.endsAt;
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const act=(action,extra)=>post("/api/host",Object.assign({key:KEY,action},extra)).catch(()=>{});
const loadMe=()=>fetch("/api/me?uid="+uid).then(r=>r.json()).then(j=>{if(j.round===round){mine=j.answers;render()}}).catch(()=>{});
const H2="font-family:'Cormorant Garamond',Georgia,serif;margin:0";

function revealCard(r){
 const k=S.key[r],t=S.tally||{m:0,t:0},n=t.m+t.t,pm=n?Math.round(t.m/n*100):0,pt=n?100-pm:0,my=mine[r];
 return `<div class="panel c"><div class="n">Question ${r+1} of ${N()}</div><p style="font-size:1.2rem;line-height:1.4">${Q[r]}</p>
 <div class="mut">The answer is</div><div class="badge ${k.a}">${k.a==="T"?"TRUTH":"MYTH"}</div>${k.refs.map(v=>`<div class="verse"><b>${v[0]}</b>${v[1]}</div>`).join("")}
 <div class="res"><div><span>Myth</span><span>${pm}% (${t.m})</span></div><div class="track"><div class="fill M" data-w="${pm}"></div></div></div>
 <div class="res"><div><span>Truth</span><span>${pt}% (${t.t})</span></div><div class="track"><div class="fill T" data-w="${pt}"></div></div></div>
 ${host?"":`<p class="mut">${my?(my===k.a?"✓ You got it right":"✗ You chose "+(my==="M"?"Myth":"Truth")):"You didn’t answer this one"}</p>`}</div>`;
}
function render(){
 if(!S){app.innerHTML=`<p class="c mut">Connecting…</p>`;return}
 const done=Object.keys(mine).length,lk=isLocked();let h="";
 if(S.phase==="lobby"){
  h=host?`<div class="panel c"><b>Scan to join</b><br><span id="qrslot"></span><div class="mut small">${joinUrl}</div>
  <p><b>${S.players}</b> ${S.players===1?"person":"people"} joined</p>
  <div class="row"><label>Timer (minutes) <input id="mins" type="number" min="1" max="120" value="15"></label><button class="go" id="start">Start questions</button></div></div>`
  :`<div class="panel c"><p>You’re in, anonymously. 🕊️</p><p class="mut">Waiting for the host to start…</p></div>`;
 }else if(S.phase==="answering"){
  h=`<div class="tm" id="tm">${mmss(S.endsAt-now())}</div>`;
  if(host)h+=`<div class="panel c"><p><b>${S.finished}</b> of <b>${S.players}</b> finished all ${N()} questions</p><div class="row"><button id="plus">+1 min</button><button class="go" id="end">End now</button></div></div>`;
  else{h+=`<p class="c mut" id="prog">${done} of ${N()} answered · you can change answers until time is up</p>`;
   Q.forEach((q,i)=>{h+=`<div class="card"><span class="n">${i+1}</span><p>${q}</p><div class="btns"><button data-q="${i}" data-a="M" class="${mine[i]==="M"?"on":""}" ${lk?"disabled":""}>Myth</button><button data-q="${i}" data-a="T" class="${mine[i]==="T"?"on":""}" ${lk?"disabled":""}>Truth</button></div></div>`})}
 }else{
  const r=S.reveal;
  if(r<0)h=`<div class="panel c"><h2 style="${H2}">Time’s up!</h2>${host?`<p><b>${S.finished}</b> of <b>${S.players}</b> finished everything.</p><button class="go" id="next">Reveal first answer</button>`:`<p>You completed <b>${done}</b> of ${N()} questions.</p><p class="mut">Waiting for the host to reveal the answers…</p>`}</div>`;
  else if(r<N())h=revealCard(r)+(host?`<div class="row">${r>0?`<button id="prev">← Previous</button>`:""}<button class="go" id="next">${r===N()-1?"Show final screen":"Next question →"}</button></div>`:"");
  else{let ok=0;S.key.forEach((k,i)=>{if(mine[i]===k.a)ok++});
   const sm=S.summary?`<div class="panel c"><div class="n">Scored 80% or higher</div><div class="badge T">${S.summary.high} of ${S.summary.people}</div><p class="mut">${S.summary.people?Math.round(S.summary.high/S.summary.people*100):0}% of participants got ${S.summary.need}+ of ${N()} right</p></div>`:"";
   h=`<div class="panel c"><h2 style="${H2};font-size:1.8rem">That’s a wrap!</h2>${host?`<p>All ${N()} answers revealed. Thank you for hosting.</p>`:`<p>You answered <b>${done}</b> of ${N()} and got <b>${ok}</b> right.</p>`}</div>${sm}${host?`<div class="row"><button id="prev">← Back to last question</button><button class="go" id="reset">Start a new round</button></div>`:`<p class="c mut">Guard your heart above all else.</p>`}`}
 }
 app.innerHTML=h;const slot=$("#qrslot");if(slot)slot.appendChild(qrEl);
 requestAnimationFrame(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"));
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.q!==undefined){
  if(isLocked())return;const q=+b.dataset.q,a=b.dataset.a;mine[q]=a;
  document.querySelectorAll(`button[data-q="${q}"]`).forEach(x=>x.classList.toggle("on",x.dataset.a===a));
  $("#prog").textContent=Object.keys(mine).length+" of "+N()+" answered · you can change answers until time is up";
  post("/api/vote",{uid,q,a}).then(r=>{if(!r.ok)loadMe()}).catch(()=>loadMe());return}
 if(!host)return;
 if(b.id==="start")act("start",{minutes:+$("#mins").value||15});
 if(b.id==="plus")act("plus");if(b.id==="end")act("end");
 if(b.id==="next")act("next");if(b.id==="prev")act("prev");if(b.id==="reset")act("reset");
});
const es=new EventSource("/events"+(host?"":"?uid="+uid));
es.onmessage=e=>{
 const d=JSON.parse(e.data);if(d.questions)Q=d.questions;S=d;off=d.now-Date.now();
 if(d.round!==round){round=d.round;mine={};if(!host&&d.phase!=="lobby")loadMe()}
 const k=d.phase+d.round+d.reveal;
 if(!host&&d.phase==="answering"&&k===lastKey)return; // don't redraw while people are tapping
 lastKey=k;render();
};
setInterval(()=>{
 if(S&&S.phase==="answering"){const ms=S.endsAt-now(),t=$("#tm");
  if(t){t.textContent=ms<=0?"Time’s up!":mmss(ms);t.classList.toggle("low",ms<60000)}
  if(ms<=0)document.querySelectorAll("button[data-q]").forEach(b=>b.disabled=true)}
},500);
render();
</script></body></html>
